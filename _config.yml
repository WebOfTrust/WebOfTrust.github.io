# Force-publish the dotted .well-known/ tree; Jekyll skips dot-directories by
# default. OOBIs live under .well-known/{aid,schema,witness}/oobi/ (structured)
# and .well-known/oobi/ (flat lookup, generated by scripts/flatten-oobis.py).
include: [".well-known"]

# Build tooling, not site content. scripts/build-wellknown.py regenerates the
# flat .well-known/oobi/ mirror and .well-known/host-meta.json from the
# structured .well-known/{aid,schema,witness}/oobi tree; run it locally and
# commit the output (Pages has no server-side build step).
exclude: ["scripts"]
