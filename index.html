<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- GitHub Pages can't do a server-side 301, so redirect client-side. -->
  <meta http-equiv="refresh" content="0; url=/.well-known/">
  <link rel="canonical" href="/.well-known/">
  <meta name="robots" content="noindex">
  <title>GLEIF .well-known Discovery</title>
  <script>location.replace("/.well-known/");</script>
</head>
<body>
  <p>Redirecting to <a href="/.well-known/">/.well-known/</a>&hellip;</p>
</body>
</html>
